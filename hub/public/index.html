<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>claude-web</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%275%27 fill=%27%233b7ce6%27/%3E%3Ctext x=%278%27 y=%2712%27 font-size=%2711%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27monospace%27%3E%E2%9D%AF%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="window">
    <aside id="rail">
      <header class="rail-head">
        <h1>claude-web</h1>
        <span id="root" class="muted" title="launch directory"></span>
        <button id="new-toggle" class="primary">New Session</button>
        <label class="rail-toggle" title="Sessions that are alive but have no conversation yet (an unused terminal tab)"><input type="checkbox" id="show-empty" /> Show empty sessions <span id="empty-count"></span></label>
      </header>
      <form id="new-form" hidden>
        <label>Directory <input name="cwd" placeholder="(launch directory)" /></label>
        <label>Name <input name="name" placeholder="optional" /></label>
        <label>First prompt <textarea name="prompt" rows="3" placeholder="optional; typed once the session is ready"></textarea></label>
        <div class="row">
          <button type="submit" class="primary">Start</button>
          <button type="button" id="new-cancel">Cancel</button>
        </div>
      </form>
      <ul id="sessions"></ul>
      <footer class="rail-foot muted"><span id="conn">connecting…</span></footer>
    </aside>

    <main id="main">
      <section id="empty" class="empty">
        <p>Select a session on the left, or start a new one.</p>
      </section>

      <section id="view" hidden>
        <header id="view-head">
          <div class="title-block">
            <h2 id="view-title"></h2>
            <div class="muted small" id="view-sub"></div>
          </div>
          <nav class="tabs">
            <button class="tab active" data-tab="conv">Conversation</button>
            <button class="tab" data-tab="term" id="tab-term">Terminal</button>
          </nav>
          <div class="toggles small">
            <label><input type="checkbox" id="show-thinking" /> Thinking</label>
            <label><input type="checkbox" id="show-meta" /> Meta</label>
            <label><input type="checkbox" id="show-sidechain" /> Subagents</label>
            <label><input type="checkbox" id="follow" checked /> Follow</label>
          </div>
        </header>

        <div id="perm-banner" hidden></div>

        <div id="conv" class="pane">
          <div id="truncated" class="notice" hidden>Older entries were omitted to keep the page light.</div>
          <div id="timeline"></div>
        </div>
        <div id="term" class="pane" hidden><div id="xterm"></div></div>

        <footer id="composer">
          <textarea id="msg" rows="2" placeholder="Message the session… (Enter to send, Shift+Enter for newline)"></textarea>
          <div class="actions">
            <button id="send" class="primary">Send</button>
            <button id="resume" class="primary" title="Continue this session here: claude --resume, in its own directory" hidden>Resume</button>
            <button id="stop" title="Escape: interrupt the current turn">Stop</button>
            <button id="kill" class="danger">Kill</button>
          </div>
          <div id="status-bar" class="small muted"></div>
        </footer>
      </section>
    </main>
    </div>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/xterm-addon-fit.js"></script>
    <script src="/markdown.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
